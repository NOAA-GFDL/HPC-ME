mirror-image:
  stage: mirror
  extends: .buildRules
  variables:
    SOURCE_REGISTRY: registry.rdhpcs.noaa.gov
    SOURCE_IMAGE: registry.rdhpcs.noaa.gov/containers/hpc-me/2026.01.01-image:spack-release-test-gcc
    APP: "spack-release"
    OS: rockylinux8
    COMPILER_TYPE: gcc
    COMPILER_VERSION: 14.3
  rules:
    - when: manual
      allow_failure: false
  <<: *mirrorScript

pipeline-cleanup:
  stage: cleanup
  script:
    - echo "Cleaning up cached Podman images after builds"
    - podman rmi -a -f
    - podman system prune --external --force
    - podman system prune --all --force 
  rules:
    - when: on_success